<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Extraction 11ème / 12ème</title>
<style>
  :root{--ardoise:#2b3138;--cendre:#eceae5;--ocre:#c8842a}
  *{box-sizing:border-box}
  body{margin:0;padding:18px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--cendre);color:var(--ardoise)}
  h1{font-size:19px;margin:0 0 4px}
  p.sous{margin:0 0 18px;font-size:14px;opacity:.7}
  button{display:block;width:100%;margin:0 0 10px;padding:15px;border:0;border-radius:10px;
         background:var(--ardoise);color:#fff;font-size:16px;font-weight:600}
  button:disabled{opacity:.45}
  button.ocre{background:var(--ocre)}
  #journal{margin-top:18px;background:#fff;border-radius:10px;padding:12px;
           font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;
           word-break:break-word;min-height:60px}
  .ok{color:#1d7a43}.ko{color:#b3261e}
  .avert{margin-top:18px;padding:12px;border-left:4px solid var(--ocre);
         background:#fff;font-size:13px;border-radius:0 8px 8px 0}
</style>
</head>
<body>

<h1>Extraction des leçons</h1>
<p class="sous">11ème et 12ème année — page de travail temporaire</p>

<button id="b11">Extraire la 11ème année</button>
<button id="b12">Extraire la 12ème année</button>
<button id="bts" class="ocre">Extraire les deux</button>

<div id="journal">Prêt. Touche un bouton.</div>

<div class="avert">
  <b>À supprimer après usage.</b> Cette page déchiffre les contenus payants.
  Elle ne doit rester en ligne que le temps de l'extraction.
</div>

<script>
(function(){
'use strict';

/* Seuls ces deux fichiers peuvent être extraits. Toute autre demande est refusée. */
var AUTORISES = {
  '11eme': 'modules/classes/11eme.json',
  '12eme': 'modules/classes/12eme.json'
};

var journal = document.getElementById('journal');
var boutons = [document.getElementById('b11'), document.getElementById('b12'), document.getElementById('bts')];

function dire(texte, classe){
  var ligne = document.createElement('div');
  if(classe) ligne.className = classe;
  ligne.textContent = texte;
  journal.appendChild(ligne);
  journal.scrollTop = journal.scrollHeight;
}
function vider(){ journal.textContent = ''; }
function verrou(etat){ boutons.forEach(function(b){ b.disabled = etat; }); }

/* ---- 1. Le jeton de session, lu directement dans le stockage du navigateur ---- */
function jeton(){
  for(var i=0;i<localStorage.length;i++){
    var cle = localStorage.key(i);
    if(cle && cle.indexOf('sb-') === 0 && cle.indexOf('-auth-token') > -1){
      try{
        var brut = localStorage.getItem(cle);
        if(brut && brut.indexOf('base64-') === 0){
          brut = atob(brut.slice(7).replace(/-/g,'+').replace(/_/g,'/'));
        }
        var v = JSON.parse(brut);
        if(v && v.access_token) return v.access_token;
        if(v && v.currentSession && v.currentSession.access_token) return v.currentSession.access_token;
      }catch(_e){}
    }
  }
  return '';
}

/* ---- 2. Le manifeste : il donne la version de contenu et le nom des fichiers ---- */
var manifestePromesse = null;
function manifeste(){
  if(manifestePromesse) return manifestePromesse;
  manifestePromesse = fetch('/protected/manifest.json', {cache:'no-store', credentials:'same-origin'})
    .then(function(r){
      if(!r.ok) throw new Error('Manifeste indisponible (' + r.status + ').');
      return r.json();
    })
    .then(function(m){
      if(!m || !Array.isArray(m.entries)) throw new Error('Manifeste illisible.');
      m.parChemin = {};
      m.entries.forEach(function(e){ m.parChemin[String(e.path||'').replace(/^\/+/,'')] = e; });
      return m;
    })
    .catch(function(err){ manifestePromesse = null; throw err; });
  return manifestePromesse;
}

/* ---- 3. La clé de contenu, délivrée par /api/content-key contre l'abonnement ---- */
var clePromesse = null;
function cleContenu(){
  if(clePromesse) return clePromesse;
  clePromesse = (async function(){
    var jwt = jeton();
    if(!jwt) throw new Error('Aucune session trouvée. Ouvre Nexora, connecte-toi, puis reviens ici.');

    var m = await manifeste();
    dire('Manifeste lu — version ' + m.version + ', ' + m.entries.length + ' entrées.', 'ok');

    var paire = await crypto.subtle.generateKey(
      {name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256'},
      true, ['wrapKey','unwrapKey']
    );
    var jwk = await crypto.subtle.exportKey('jwk', paire.publicKey);

    var reponse = await fetch('/api/content-key', {
      method:'POST', credentials:'same-origin', cache:'no-store',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + jwt},
      body: JSON.stringify({
        public_key_jwk: jwk,
        content_version: m.version,
        product_code: 'academy',
        device_id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()))
      })
    });

    var data = {};
    try{ data = await reponse.json(); }catch(_e){}
    if(!reponse.ok || data.success !== true){
      throw new Error('Clé refusée (' + reponse.status + ') : ' + (data.message || 'sans détail'));
    }

    var b64 = String(data.wrapped_key||'').replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length % 4) b64 += '=';
    var brut = atob(b64), octets = new Uint8Array(brut.length);
    for(var i=0;i<brut.length;i++) octets[i] = brut.charCodeAt(i);

    var cle = await crypto.subtle.unwrapKey(
      'raw', octets, paire.privateKey, {name:'RSA-OAEP'}, {name:'AES-GCM'}, false, ['decrypt']
    );
    dire('Clé de contenu obtenue — abonnement valide jusqu\'au ' + String(data.ends_at||'?').slice(0,10) + '.', 'ok');
    return {cle:cle, manifeste:m};
  })().catch(function(err){ clePromesse = null; throw err; });
  return clePromesse;
}

/* ---- 4. Téléchargement et déchiffrement d'un fichier ---- */
async function extraire(nom){
  var chemin = AUTORISES[nom];
  if(!chemin) throw new Error('Fichier non autorisé.');

  var ctx = await cleContenu();
  var entree = ctx.manifeste.parChemin[chemin];
  if(!entree) throw new Error('Introuvable au manifeste : ' + chemin);

  var cible = /^https?:/i.test(String(entree.url||'')) ? entree.url : '/' + String(entree.url||'').replace(/^\/+/,'');
  dire('Téléchargement de ' + nom + '…');

  var r = await fetch(cible, {credentials:'same-origin'});
  if(!r.ok) throw new Error('Téléchargement impossible (' + r.status + ').');
  var paquet = new Uint8Array(await r.arrayBuffer());
  dire('Reçu : ' + paquet.length.toLocaleString('fr-FR') + ' octets chiffrés.');

  if(paquet.length < 33 || String.fromCharCode.apply(null, paquet.slice(0,4)) !== 'NXE1'){
    throw new Error('Paquet sécurisé invalide.');
  }
  var iv = paquet.slice(4,16), chiffre = paquet.slice(16);
  var clair = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv:iv, additionalData:new TextEncoder().encode(chemin)},
    ctx.cle, chiffre
  );

  var texte = new TextDecoder().decode(clair);
  try{
    var objet = JSON.parse(texte);
    var matieres = Array.isArray(objet) ? objet.length : Object.keys(objet).length;
    dire('Déchiffré : ' + texte.length.toLocaleString('fr-FR') + ' caractères, ' + matieres + ' matières.', 'ok');
  }catch(_e){
    dire('Déchiffré, mais le JSON ne se relit pas — fichier enregistré quand même.', 'ko');
  }

  var lien = document.createElement('a');
  lien.href = URL.createObjectURL(new Blob([texte], {type:'application/json'}));
  lien.download = nom + '.json';
  document.body.appendChild(lien);
  lien.click();
  setTimeout(function(){ URL.revokeObjectURL(lien.href); lien.remove(); }, 4000);
  dire('Enregistré sous ' + nom + '.json — regarde tes téléchargements.', 'ok');
}

async function lancer(liste){
  vider(); verrou(true);
  try{
    for(var i=0;i<liste.length;i++){
      await extraire(liste[i]);
      if(i < liste.length - 1) await new Promise(function(r){ setTimeout(r, 1500); });
    }
    dire('Terminé. Pense à supprimer cette page du dépôt.', 'ok');
  }catch(err){
    dire('ÉCHEC : ' + (err && err.message ? err.message : err), 'ko');
  }
  verrou(false);
}

document.getElementById('b11').addEventListener('click', function(){ lancer(['11eme']); });
document.getElementById('b12').addEventListener('click', function(){ lancer(['12eme']); });
document.getElementById('bts').addEventListener('click', function(){ lancer(['11eme','12eme']); });
})();
</script>
</body>
</html>
