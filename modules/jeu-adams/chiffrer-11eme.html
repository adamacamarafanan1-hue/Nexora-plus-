<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chiffrement 11ème</title>
<style>
  :root{--ardoise:#2b3138;--cendre:#eceae5;--ocre:#c8842a}
  *{box-sizing:border-box}
  body{margin:0;padding:18px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--cendre);color:var(--ardoise)}
  h1{font-size:19px;margin:0 0 4px}
  p.sous{margin:0 0 18px;font-size:14px;opacity:.7}
  label.fichier{display:block;background:#fff;border:2px dashed #b9b4aa;border-radius:10px;
                padding:18px;text-align:center;font-size:15px;margin:0 0 12px}
  input[type=file]{display:block;width:100%;margin-top:10px;font-size:14px}
  button{display:block;width:100%;margin:0 0 10px;padding:15px;border:0;border-radius:10px;
         background:var(--ocre);color:#fff;font-size:16px;font-weight:600}
  button:disabled{opacity:.45}
  #journal{margin-top:18px;background:#fff;border-radius:10px;padding:12px;
           font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;
           word-break:break-word;min-height:60px}
  .ok{color:#1d7a43}.ko{color:#b3261e}
  .avert{margin-top:18px;padding:12px;border-left:4px solid var(--ocre);
         background:#fff;font-size:13px;border-radius:0 8px 8px 0}
</style>
</head>
<body>

<h1>Chiffrement du fichier de 11ème</h1>
<p class="sous">Page de travail temporaire — à supprimer après usage</p>

<label class="fichier">
  Choisis le fichier <b>11eme.json</b> reçu
  <input type="file" id="fichier" accept=".json,application/json">
</label>

<button id="go" disabled>Chiffrer</button>

<div id="journal">En attente du fichier.</div>

<div class="avert">
  <b>À supprimer après usage.</b> Cette page obtient la clé de contenu.
  Elle ne doit rester en ligne que le temps du chiffrement.
</div>

<script>
(function(){
'use strict';

/* Le chemin logique du fichier. Il sert d'additionalData au chiffrement :
   la moindre différence rendrait le déchiffrement impossible côté élève. */
var CHEMIN = 'modules/classes/11eme.json';
/* Nom du fichier produit. Il est NEUF à dessein : les .nxe sont mis en cache
   pour un an par URL, donc réutiliser l'ancien nom empêcherait toute
   mise à jour chez les élèves qui ont déjà ouvert la 11ème. */
var NOUVEAU_NOM = '94717934ac2b3feac90ae69b.nxe';
var TAILLE_ATTENDUE = 1581074;

var journal = document.getElementById('journal');
var champ = document.getElementById('fichier');
var bouton = document.getElementById('go');

function dire(t, c){
  var l = document.createElement('div');
  if(c) l.className = c;
  l.textContent = t;
  journal.appendChild(l);
}
function vider(){ journal.textContent = ''; }

champ.addEventListener('change', function(){
  vider();
  var f = champ.files && champ.files[0];
  if(!f){ bouton.disabled = true; return; }
  dire('Fichier : ' + f.name + ' — ' + f.size.toLocaleString('fr-FR') + ' octets.');
  bouton.disabled = false;
});

/* ---- Le jeton de session, lu dans le stockage du navigateur ---- */
function jeton(){
  for(var i=0;i<localStorage.length;i++){
    var cle = localStorage.key(i);
    if(cle && cle.indexOf('sb-') === 0 && cle.indexOf('-auth-token') > -1){
      try{
        var brut = localStorage.getItem(cle);
        if(brut && brut.indexOf('base64-') === 0){
          brut = atob(brut.slice(7).replace(/-/g,'+').replace(/_/g,'/'));
        }
        var v = JSON.parse(brut);
        if(v && v.access_token) return v.access_token;
        if(v && v.currentSession && v.currentSession.access_token) return v.currentSession.access_token;
      }catch(_e){}
    }
  }
  return '';
}

/* ---- La clé de contenu, obtenue exactement comme le fait l'application ---- */
async function cleContenu(){
  var jwt = jeton();
  if(!jwt) throw new Error('Aucune session. Ouvre Nexora dans ce navigateur, connecte-toi, puis reviens.');

  var rm = await fetch('/protected/manifest.json', {cache:'no-store', credentials:'same-origin'});
  if(!rm.ok) throw new Error('Manifeste indisponible (' + rm.status + ').');
  var m = await rm.json();
  dire('Manifeste lu — version ' + m.version + '.', 'ok');

  var paire = await crypto.subtle.generateKey(
    {name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256'},
    true, ['wrapKey','unwrapKey']
  );
  var jwk = await crypto.subtle.exportKey('jwk', paire.publicKey);

  var r = await fetch('/api/content-key', {
    method:'POST', credentials:'same-origin', cache:'no-store',
    headers:{'Content-Type':'application/json','Authorization':'Bearer ' + jwt},
    body: JSON.stringify({
      public_key_jwk: jwk,
      content_version: m.version,
      product_code: 'academy',
      device_id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()))
    })
  });
  var data = {};
  try{ data = await r.json(); }catch(_e){}
  if(!r.ok || data.success !== true){
    throw new Error('Clé refusée (' + r.status + ') : ' + (data.message || 'sans détail'));
  }

  var b64 = String(data.wrapped_key||'').replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  var brut = atob(b64), oct = new Uint8Array(brut.length);
  for(var i=0;i<brut.length;i++) oct[i] = brut.charCodeAt(i);

  /* La clé doit servir à chiffrer ET à déchiffrer : on demande les deux usages. */
  var cle = await crypto.subtle.unwrapKey(
    'raw', oct, paire.privateKey, {name:'RSA-OAEP'},
    {name:'AES-GCM'}, false, ['encrypt','decrypt']
  );
  dire('Clé de contenu obtenue.', 'ok');
  return cle;
}

bouton.addEventListener('click', async function(){
  vider(); bouton.disabled = true; champ.disabled = true;
  try{
    var f = champ.files[0];
    var clair = new Uint8Array(await f.arrayBuffer());
    dire('Lu : ' + clair.length.toLocaleString('fr-FR') + ' octets en clair.');

    /* Contrôle : le contenu doit être un JSON valide et comporter 11 matières. */
    var objet = JSON.parse(new TextDecoder().decode(clair));
    var nb = Object.keys(objet).length;
    var lecons = 0;
    for(var k in objet){ if(objet[k] && objet[k].lessons) lecons += objet[k].lessons.length; }
    dire('JSON valide : ' + nb + ' matières, ' + lecons + ' leçons.', 'ok');
    if(nb !== 11 || lecons !== 275) throw new Error('Contenu inattendu — on attend 11 matières et 275 leçons.');

    var cle = await cleContenu();

    var iv = crypto.getRandomValues(new Uint8Array(12));
    var chiffre = new Uint8Array(await crypto.subtle.encrypt(
      {name:'AES-GCM', iv:iv, additionalData:new TextEncoder().encode(CHEMIN)},
      cle, clair
    ));

    /* Assemblage du paquet : NXE1 + IV (12 o) + chiffré (tag inclus). */
    var paquet = new Uint8Array(4 + 12 + chiffre.length);
    paquet.set([0x4E,0x58,0x45,0x31], 0);
    paquet.set(iv, 4);
    paquet.set(chiffre, 16);
    dire('Chiffré : ' + paquet.length.toLocaleString('fr-FR') + ' octets.', 'ok');

    if(paquet.length !== TAILLE_ATTENDUE){
      dire('ATTENTION : taille différente de celle annoncée (' +
           TAILLE_ATTENDUE.toLocaleString('fr-FR') + '). Le manifeste devra être corrigé.', 'ko');
    }

    /* Vérification immédiate : on redéchiffre pour s'assurer que le paquet est lisible. */
    var relu = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:iv, additionalData:new TextEncoder().encode(CHEMIN)},
      cle, paquet.slice(16)
    );
    if(new Uint8Array(relu).length !== clair.length) throw new Error('Contrôle de relecture échoué.');
    dire('Contrôle : le paquet se déchiffre correctement.', 'ok');

    var lien = document.createElement('a');
    lien.href = URL.createObjectURL(new Blob([paquet], {type:'application/octet-stream'}));
    lien.download = NOUVEAU_NOM;
    document.body.appendChild(lien);
    lien.click();
    setTimeout(function(){ URL.revokeObjectURL(lien.href); lien.remove(); }, 6000);
    dire('Enregistré sous ' + NOUVEAU_NOM + '.', 'ok');
    dire('Vérifie le nom exact avant de le déposer sur GitHub.', 'ok');
  }catch(err){
    dire('ÉCHEC : ' + (err && err.message ? err.message : err), 'ko');
  }
  bouton.disabled = false; champ.disabled = false;
});
})();
</script>
</body>
</html>
