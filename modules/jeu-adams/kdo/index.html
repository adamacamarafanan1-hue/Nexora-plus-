<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jeu Adams KDO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1b4b;font-family:'Exo 2',sans-serif;min-height:100vh;color:white;overflow-x:hidden;padding:10px}
.wrap{max-width:1320px;margin:0 auto}
.head{text-align:center;margin-bottom:10px}
.head h1{font-family:'Orbitron',sans-serif;font-size:1.15rem;letter-spacing:3px;color:#ffd700}
.head p{font-size:.82rem;color:rgba(255,255,255,.78);margin-top:3px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:10px}
.panel{background:linear-gradient(145deg,#162060,#2d1060);border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 26px rgba(0,0,0,.35)}
.panel h3{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:2px;color:#ffd700;margin-bottom:10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.formgrid input,.formgrid select{padding:10px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:white;font-size:.86rem;font-family:'Exo 2',sans-serif;font-weight:700;outline:none}
.formgrid input::placeholder{color:rgba(255,255,255,.35)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{padding:10px 16px;border:none;border-radius:10px;color:white;font-weight:800;cursor:pointer;font-family:'Exo 2',sans-serif}
.btn.start{background:linear-gradient(135deg,#b8860b,#ffd700);color:#1a0a00}
.btn.reset{background:rgba(255,255,255,.14)}
.turn{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.turn .name{font-size:.95rem;font-weight:900;color:#ffd700}
.turn .meta{font-size:.76rem;color:rgba(255,255,255,.8);margin-top:3px;line-height:1.45}
.scorelist{display:flex;flex-direction:column;gap:8px}
.scorecard{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:2px solid transparent}
.scorecard.active{border-color:#ffd700;background:rgba(255,215,0,.12)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.85);flex-shrink:0}
.smain{flex:1}
.sname{font-size:.84rem;font-weight:800}
.smeta{font-size:.7rem;color:rgba(255,255,255,.6);margin-top:2px}
.spts{font-size:1rem;font-weight:900;color:#ffd700}

.boardbox{padding:4px}

.s-logo{font-size:2rem;font-weight:900;letter-spacing:3px;margin-bottom:4px}
.s-sub{color:#a0aec0;font-size:.88rem;margin-bottom:24px}
.s-lbl{color:#94a3b8;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.count-row{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
.cbtn{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:white;font-size:1.8rem;font-weight:900;cursor:pointer;transition:all .2s;font-family:'Exo 2',sans-serif}
.go-btn{padding:14px 48px;border:none;border-radius:50px;color:white;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:'Exo 2',sans-serif;letter-spacing:1px;transition:all .2s}
.go-btn:hover{transform:translateY(-2px)}
.g-inner{width:100%;max-width:1050px}
.setup-box{background:linear-gradient(145deg,#162060,#2d1060);border-radius:22px;padding:36px;text-align:center;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);margin:60px auto 0}
.name-inputs{display:flex;flex-direction:column;gap:9px;margin-bottom:24px}
.name-inputs input{padding:12px 16px;border-radius:10px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:white;font-size:.92rem;font-family:'Exo 2',sans-serif;outline:none;transition:border .2s}
.name-inputs input::placeholder{color:rgba(255,255,255,.35)}
.board-shell{border-radius:16px;padding:7px;box-shadow:0 10px 40px rgba(0,0,0,.7)}
.inner{border-radius:12px;padding:5px;display:flex;flex-direction:column;gap:2px}
.alpha-row{display:flex;justify-content:space-around;padding:1px 30px}
.alpha-row span,.alpha-col span{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:800;color:rgba(255,255,255,.85)}
.board-mid{display:grid;grid-template-columns:24px 1fr 24px}
.alpha-col{display:flex;flex-direction:column;justify-content:space-around}
.alpha-col.r{transform:rotate(180deg)}
.circ-row{display:flex;justify-content:space-around;align-items:center;padding:1px 6px}
.circ{width:32px;height:32px;border-radius:50%;border:3px solid white;background:rgba(255,255,255,.1)}
.score-sec{display:flex;flex-direction:column;gap:2px}
.score-row{display:flex;align-items:center;gap:2px}
.cell{position:relative;flex:1;min-width:0;height:32px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:.65rem;font-weight:800;color:white;overflow:visible}
.cell.b{background:#3b82f6;border:1px solid #2563eb}
.cell.gold{background:linear-gradient(135deg,#b8860b,#ffd700);border:2px solid #ffd700;box-shadow:0 0 8px rgba(255,215,0,.6);color:#1a0a00;font-size:.7rem}
.cell-n{position:relative;z-index:1;pointer-events:none}
.tl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.pion{width:16px;height:16px;border-radius:50%;border:2.5px solid white;flex-shrink:0;animation:pop .3s ease}
.pion.active{width:20px;height:20px;border:3px solid white;z-index:20}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
.center{display:flex;gap:5px}
.disc-panel{flex:1;background:linear-gradient(145deg,#b0135a,#8b11b0);border-radius:11px;padding:9px 10px;display:flex;flex-direction:column;gap:4px}
.g-title-bar{border-radius:40px;padding:8px 0;text-align:center;font-size:1rem;font-weight:900;letter-spacing:2px;box-shadow:inset 0 2px 4px rgba(255,255,255,.2),0 4px 12px rgba(0,0,0,.3)}
.arrow{color:rgba(255,255,255,.8);font-size:.9rem;letter-spacing:-1px;text-align:right;padding-right:5px}
.arrow.l{text-align:left;padding-left:5px}
.disc-grid{display:flex;gap:6px;flex-wrap:wrap}
.disc-card{flex:1;min-width:80px;border-radius:12px;padding:10px 6px 8px;text-align:center;cursor:pointer;border:2px solid rgba(255,255,255,.3);transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.disc-card:hover{transform:translateY(-3px) scale(1.04);border-color:rgba(255,255,255,.7);box-shadow:0 8px 22px rgba(0,0,0,.5)}
.disc-n{width:26px;height:26px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;margin:0 auto 5px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.disc-lbl{font-size:.68rem;font-weight:800;color:white;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.5);letter-spacing:.3px}
.bonus-panel{width:100px;border-radius:9px;padding:5px 4px;display:flex;flex-direction:column;gap:2px}
.bonus-hdr{display:flex;gap:2px;margin-bottom:2px}
.bonus-hdr span{flex:1;text-align:center;font-size:.55rem;font-weight:700;color:#ffd700}
.bonus-row{display:flex;gap:2px}
.bonus-cell{flex:1;height:28px;background:#3b82f6;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:800;border:1px solid #2563eb;position:relative;overflow:visible}
.bonus-cell.gold-bonus{background:linear-gradient(135deg,#b8860b,#ffd700);border:1px solid #ffd700;color:#1a0a00;box-shadow:0 0 6px rgba(255,215,0,.5)}
.champ-bot{text-align:right;font-weight:900;font-size:.7rem;letter-spacing:2px;color:white;padding:2px 7px 0}
.champ-side{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;font-size:.55rem;letter-spacing:2px;color:white;padding:0 3px;white-space:nowrap;flex-shrink:0}
.ctrl{margin-top:9px;background:linear-gradient(145deg,#162060,#220e55);border-radius:16px;padding:12px 14px;box-shadow:0 5px 22px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.09)}
.ap-banner{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:11px;margin-bottom:10px;border:2px solid;animation:bpulse 1.8s ease infinite}
@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.7}}
.ap-dot{width:24px;height:24px;border-radius:50%;border:2.5px solid rgba(255,255,255,.8);flex-shrink:0}
.ap-lbl{font-size:.7rem;color:rgba(255,255,255,.6);font-weight:600}
.ap-name{font-size:1.05rem;font-weight:900}
.ap-pos{margin-left:auto;font-size:.78rem;color:rgba(255,255,255,.65)}
.disc-chosen{border-radius:50px;padding:7px 16px;font-size:.82rem;font-weight:700;margin-bottom:10px;text-align:center;background:linear-gradient(135deg,#e8920a,#9c27b0)}
.pts-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pts-lbl{font-size:.8rem;color:#94a3b8;font-weight:600}
.pts-btns{display:flex;gap:7px}
.pt-btn{width:50px;height:50px;border-radius:11px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:white;font-size:1.1rem;font-weight:900;cursor:pointer;font-family:'Exo 2',sans-serif;transition:all .15s}
.pt-btn.z{font-size:.78rem}
.skip-btn{margin-left:auto;padding:10px 20px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);border-radius:9px;color:#94a3b8;font-size:.82rem;font-weight:700;cursor:pointer;font-family:'Exo 2',sans-serif;transition:all .15s}
.skip-btn:hover{background:rgba(255,255,255,.14);color:white}
.scoreboard{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.sc-card{flex:1;min-width:100px;background:rgba(255,255,255,.06);border-radius:9px;padding:8px 11px;display:flex;align-items:center;gap:8px;border:2px solid transparent;transition:all .2s}
.sc-card.cur{border-color:#ffd700;background:rgba(255,215,0,.1);box-shadow:0 0 12px rgba(255,215,0,.3)}
.sc-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex-shrink:0}
.sc-info{flex:1}
.sc-name{font-size:.75rem;font-weight:700}
.sc-pos{font-size:.65rem;color:#94a3b8}
.sc-pts{font-size:1rem;font-weight:900;color:#ffd700}
.sc-card.elim{opacity:.45;border-color:rgba(255,59,59,.3)!important}
.sc-card.elim .sc-pos{color:#ff6b6b}



/* exact plateau sizing refined */
.g-inner{width:100%;max-width:100%}
.board-shell{width:100%}
.cell{height:44px;font-size:.78rem}
.cell-n{font-size:.86rem;font-weight:900}
.disc-card{min-width:92px}
.tl{gap:2px}
.pion{width:18px;height:18px;border:3px solid white}
.ctrl{display:none !important}
.setup-box{display:none !important}

/* quiz overlay */
.quiz-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:300;align-items:center;justify-content:center;padding:16px}
.quiz-ov.show{display:flex}
.quiz-box{background:linear-gradient(145deg,#162060,#2d1060);border-radius:20px;padding:26px;max-width:620px;width:100%;border:2px solid rgba(255,255,255,.14);box-shadow:0 22px 70px rgba(0,0,0,.7)}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.q-badge{border-radius:50px;padding:4px 12px;font-size:.72rem;font-weight:800}
.q-disc{background:#2196f3}
.q-pts{background:#ffd700;color:#1a0a00}
.q-player{background:rgba(255,255,255,.12)}
.q-text{font-size:1rem;font-weight:700;line-height:1.55;background:rgba(255,255,255,.06);border-radius:12px;padding:14px;border-left:4px solid #ffd700;margin-bottom:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.choice:hover{background:rgba(255,255,255,.12)}
.choice.correct{background:rgba(0,230,118,.2);border-color:#00e676}
.choice.wrong{background:rgba(255,59,59,.18);border-color:#ff3b3b}
.choice.disabled{pointer-events:none}
.opt{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.answer{display:none;margin-top:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:.86rem;line-height:1.5}
.quiz-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.qbtn{padding:11px 22px;border:none;border-radius:999px;font-weight:800;cursor:pointer;font-family:'Exo 2',sans-serif}
.qnext{background:linear-gradient(135deg,#e8920a,#ff5722);color:white;display:none}
.qnext.show{display:inline-block}
.qclose{background:rgba(255,255,255,.12);color:white}

/* JEU ADAMS KDO — plateau Adams original, mode individuel */
html,body{min-height:100%;background:#07152f}
body{padding:7px}
.wrap{max-width:1120px;margin:0 auto}
.head{display:none!important}
.layout{grid-template-columns:minmax(0,1fr)!important;gap:10px!important}
.boardbox{width:100%;min-width:0}
.side{display:block!important;width:100%}
.kdo-status-panel{margin-top:8px;padding:11px 12px!important}
.kdo-status-panel h3{margin-bottom:7px}
.kdo-hidden-controls{display:none!important}
#scoreList{display:none!important}
.result-box{display:none;margin-top:8px;border:1px solid rgba(255,215,0,.5);border-radius:14px;padding:12px;background:rgba(255,215,0,.10);color:#fff;font-weight:800;line-height:1.5}
.result-box.show{display:block}
.result-box b{display:block;color:#ffd700;font-size:1.06rem;margin-bottom:3px}
.turn .name{color:#ffd700}
.turn .meta{color:rgba(255,255,255,.78)}
.quiz-actions{display:none!important}
.answer{font-weight:800}
.answer.show{display:block}
.choice{min-height:48px}
.choice.correct,.choice.wrong{border-color:#ffd700!important;background:rgba(255,215,0,.14)!important}
#cp-title-bar{letter-spacing:.08em}
@media(max-width:700px){
  body{padding:0}
  .boardbox{padding:0}
  .board-shell{border-radius:13px;padding:3px}
  .inner{padding:3px}
  .board-mid{grid-template-columns:17px minmax(0,1fr) 17px}
  .alpha-row{padding:1px 20px}
  .alpha-row span,.alpha-col span{width:13px;height:13px;font-size:.43rem}
  .circ{width:25px;height:25px;border-width:2px}
  .cell{height:36px;font-size:.64rem}
  .cell-n{font-size:.64rem}
  .disc-panel{padding:7px 6px}
  .disc-card{min-width:66px;padding:7px 3px 6px}
  .disc-lbl{font-size:.58rem}
  .bonus-panel{width:78px;padding:3px 2px}
  .bonus-cell{height:23px;font-size:.53rem}
  .champ-side{font-size:.45rem;padding:0 1px}
  .kdo-status-panel{padding:9px!important}
  .quiz-box{width:min(96vw,620px);padding:14px}
  .choice{padding:11px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>JEU ADAMS KDO</h1></div>
<div class="layout">
    <div class="boardbox">
      <div class="g-inner" id="cp-board-wrap">
        <div class="board-shell pre-board" id="cp-board-shell">
          <div class="alpha-row" id="cp-a-top"></div>
          <div class="board-mid">
            <div class="alpha-col" id="cp-a-left"></div>
            <div class="inner pre-inner" id="cp-inner">
              <div class="circ-row" id="cp-circ-top"></div>
              <div class="score-sec" id="cp-rows-top"></div>
              <div class="center">
                <div class="disc-panel">
                  <div class="g-title-bar pre-title" id="cp-title-bar">JEU ADAMS KDO</div>
                  <div class="arrow">→→→→→→→→→→→→→→→→→→→</div>
                  <div class="disc-grid" id="cp-disc-grid"></div>
                  <div class="arrow l">←←←←←←←←←←←←←←←←←←←</div>
                </div>
                <div class="bonus-panel pre-bonus" id="cp-bonus-panel">
                  <div class="bonus-hdr"><span>1er</span><span>2ème</span><span>3ème</span></div>
                  <div id="cp-bonus-rows"></div>
                </div>
              </div>
              <div class="score-sec" id="cp-rows-bot"></div>
              <div class="circ-row" id="cp-circ-bot"></div>
              <div class="champ-bot">CHAMPION</div>
            </div>
            <div class="alpha-col r" id="cp-a-right"></div>
          </div>
          <div class="alpha-row" id="cp-a-bot"></div>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="panel kdo-status-panel">
        <h3>PARTIE</h3>
        <div class="turn" id="turnBox"><div class="name">Partie non lancée</div><div class="meta">50 questions · objectif 45/50</div></div>
        <div class="result-box" id="kdoResult" aria-live="polite"></div>
        <div id="scoreList"></div>
        <div class="kdo-hidden-controls" hidden>
          <select id="playerCount"><option value="1" selected>1 joueur</option></select>
          <input id="targetScore" type="number" value="45">
          <input id="p1" value="Joueur" type="text">
          <button type="button" id="startBtn">Lancer</button>
          <button type="button" id="resetBtn">Réinitialiser</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="quiz-ov" id="quizOv">
  <div class="quiz-box">
    <div class="q-meta">
      <span class="q-badge q-disc" id="qDisc"></span>
      <span class="q-badge q-pts" id="qPts"></span>
      <span class="q-badge q-player" id="qPlayer"></span>
      <span class="q-badge q-player" id="qIdx"></span>
    </div>
    <div class="q-text" id="qText"></div>
    <div class="choices" id="qChoices"></div>
    <div class="answer" id="qAnswer"></div>
    <div class="quiz-actions">
      <button type="button" class="qbtn qnext" id="nextBtn">Suivant</button>
      <button type="button" class="qbtn qclose" id="closeBtn">Fermer</button>
    </div>
  </div>
</div>

<script>
var CP_LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
var compDiscs=[
  {num:1,key:'kdo',label:'MATHÉMATIQUES',color:'#00b0ff',dark:'#01579b'},
  {num:2,key:'kdo',label:'FRANÇAIS',color:'#ff7043',dark:'#bf360c'},
  {num:3,key:'kdo',label:'SCIENCES',color:'#66bb6a',dark:'#1b5e20'},
  {num:4,key:'kdo',label:'HISTOIRE',color:'#8d6e63',dark:'#3e2723'},
  {num:5,key:'kdo',label:'GÉOGRAPHIE',color:'#ab47bc',dark:'#6a1b9a'},

var COMP_COLORS=['#ff3b3b'];
var compPlayers=[],compArrivalOrder=[],compCurDisc=null,compCurQ=null,currentPlayer=0,targetScore=45;
var kdoUsedQuestions=[],kdoQuestionCount=0,kdoInProgress=false,kdoLocked=false;
var KDO_TOTAL=50,KDO_TARGET=45;
var voiceEnabled=false;

function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(list){for(var i=list.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=list[i];list[i]=list[j];list[j]=t}return list}
function setBoardEnabled(enabled){document.querySelectorAll('.disc-card').forEach(function(btn){btn.style.pointerEvents=enabled?'auto':'none';btn.style.opacity=enabled?'1':'.72'})}

function cpBuildBoard(){
  var sub=CP_LETTERS.slice(0,22);
  ['cp-a-top','cp-a-bot'].forEach(function(id){document.getElementById(id).innerHTML=sub.map(function(l){return '<span>'+l+'</span>'}).join('')});
  var vs=CP_LETTERS.slice(0,16);
  ['cp-a-left','cp-a-right'].forEach(function(id){document.getElementById(id).innerHTML=vs.map(function(l){return '<span>'+l+'</span>'}).join('')});
  var pat=[0,0,1,0,0,0,0,1];
  ['cp-circ-top','cp-circ-bot'].forEach(function(id){document.getElementById(id).innerHTML=pat.map(function(p){return '<div class="circ'+(p?' pink-cell':'')+'"></div>'}).join('')});
  var rt=document.getElementById('cp-rows-top');rt.innerHTML='';for(var r=0;r<4;r++)rt.appendChild(cpMakeRow(r,'t'));
  var rb=document.getElementById('cp-rows-bot');rb.innerHTML='';for(var b=0;b<2;b++)rb.appendChild(cpMakeRow(b,'b'));
  var dg=document.getElementById('cp-disc-grid');dg.innerHTML='';
  compDiscs.forEach(function(d){
    var card=document.createElement('div');card.className='disc-card';card.id='cp-dc-'+d.num;
    card.style.background='linear-gradient(180deg,'+d.color+','+d.dark+')';card.style.borderColor='rgba(255,255,255,.25)';
    card.innerHTML='<div class="disc-n" style="color:'+d.dark+'">'+d.num+'</div><div class="disc-lbl">'+d.label.replace(/\n/g,'<br>')+'</div>';
    card.addEventListener('click',function(){compPickDisc(d.num)});dg.appendChild(card);
  });
  var br=document.getElementById('cp-bonus-rows');br.innerHTML='';
  for(var n=21;n<=30;n++){
    var row=document.createElement('div');row.className='bonus-row';
    for(var col=0;col<3;col++){
      var cell=document.createElement('div');cell.className='bonus-cell'+(n===30?' gold-bonus':'');cell.id='cp-bc-'+col+'-'+n;
      cell.innerHTML='<span style="pointer-events:none">'+n+'</span><div class="tl" id="cp-tl-bc-'+col+'-'+n+'"></div>';row.appendChild(cell);
    }
    br.appendChild(row);
  }
}
function cpMakeRow(r,sec){
  var row=document.createElement('div');row.className='score-row';
  if(sec==='t'){row.appendChild(cpMakeCell(0,'gold',sec,r));for(var n=1;n<=19;n++)row.appendChild(cpMakeCell(n,'b',sec,r));row.appendChild(cpMakeCell(20,'gold',sec,r))}
  else{row.appendChild(cpMakeCell(50,'gold',sec,r));for(var x=49;x>=32;x--)row.appendChild(cpMakeCell(x,'b',sec,r));row.appendChild(cpMakeCell(31,'gold',sec,r));if(r<2){var ch=document.createElement('div');ch.className='champ-side';ch.textContent='CHAMPION';row.appendChild(ch)}}
  return row;
}
function cpMakeCell(num,cls,sec,r){var c=document.createElement('div');c.className='cell '+cls;c.innerHTML='<span class="cell-n">'+num+'</span><div class="tl" id="cp-tl-'+sec+'-'+r+'-'+num+'"></div>';return c}
function cpRenderBoard(){
  document.querySelectorAll('[id^="cp-tl-"]').forEach(function(tl){tl.innerHTML=''})
  for(var bn=21;bn<=30;bn++)for(var bc=0;bc<3;bc++){var bcell=document.getElementById('cp-bc-'+bc+'-'+bn);if(bcell){bcell.style.outline='none';bcell.style.boxShadow=bn===30?'0 0 6px rgba(255,215,0,.5)':'none';bcell.innerHTML='<span style="pointer-events:none;font-size:.62rem;font-weight:800">'+bn+'</span><div class="tl" id="cp-tl-bc-'+bc+'-'+bn+'"></div>'}}
  compPlayers.forEach(function(p){
    var pos=Math.max(0,Math.min(50,Number(p.pos)||0));
    if(pos>=21&&pos<=30){var bcell=document.getElementById('cp-bc-0-'+pos);if(bcell){bcell.style.outline='3px solid '+p.color;bcell.style.boxShadow='0 0 10px '+p.color;bcell.innerHTML='<div class="pion active" style="background:'+p.color+';box-shadow:0 0 0 2px '+p.color+',0 0 10px '+p.color+'">1</div>'}}
    else{var tlId=pos<=20?'cp-tl-t-0-'+pos:'cp-tl-b-0-'+pos;var tl=document.getElementById(tlId);if(tl){var pawn=document.createElement('div');pawn.className='pion active';pawn.style.background=p.color;pawn.style.boxShadow='0 2px 6px rgba(0,0,0,.8),0 0 8px '+p.color;pawn.textContent='1';tl.appendChild(pawn)}}
  });
  compDiscs.forEach(function(d){var el=document.getElementById('cp-dc-'+d.num);if(!el)return;var active=compCurDisc&&compCurDisc.num===d.num;el.style.background='linear-gradient(180deg,'+d.color+','+d.dark+')';el.style.borderColor=active?'#ffd700':'rgba(255,255,255,.25)';el.style.boxShadow=active?'0 0 18px rgba(255,215,0,.8)':'';el.style.transform=active?'translateY(-3px) scale(1.07)':''})
}
function renderScores(){
  var box=document.getElementById('scoreList');box.innerHTML='';
  compPlayers.forEach(function(p){var card=document.createElement('div');card.className='scorecard active';card.innerHTML='<div class="dot" style="background:'+p.color+'"></div><div class="smain"><div class="sname">'+escapeHtml(p.name)+'</div><div class="smeta">Question '+kdoQuestionCount+'/'+KDO_TOTAL+' · '+p.score+' points</div></div><div class="spts">'+p.score+'</div>';box.appendChild(card)})
}
function renderTurn(){
  var box=document.getElementById('turnBox');
  if(!compPlayers.length){box.innerHTML='<div class="name">Partie non lancée</div><div class="meta">50 questions · objectif 45/50</div>';return}
  var p=compPlayers[0];box.innerHTML='<div class="name">'+escapeHtml(p.name)+'</div><div class="meta">Question '+kdoQuestionCount+'/'+KDO_TOTAL+' · Score '+p.score+'/'+KDO_TOTAL+' · Objectif '+KDO_TARGET+'/'+KDO_TOTAL+'</div>';renderScores();cpRenderBoard()
}
function resetQuestions(){kdoUsedQuestions=[]}
function getQuestion(){
  if(kdoUsedQuestions.length>=KDO_BANK.length)kdoUsedQuestions=[];
  var idx;do{idx=Math.floor(Math.random()*KDO_BANK.length)}while(kdoUsedQuestions.indexOf(idx)>-1&&kdoUsedQuestions.length<KDO_BANK.length);
  kdoUsedQuestions.push(idx);
  var raw=KDO_BANK[idx],options=(raw.choices||[]).slice(0,4).map(function(txt,i){return{text:String(txt),correct:i===Number(raw.ans)}});
  shuffle(options);
  return{idx:idx+1,data:{q:String(raw.q||''),choices:options.map(function(o){return o.text}),answer:options.findIndex(function(o){return o.correct}),points:1}};
}
function compPickDisc(num){
  if(!kdoInProgress||kdoLocked||kdoQuestionCount>=KDO_TOTAL)return;
  var d=compDiscs.find(function(x){return x.num===num})||compDiscs[0];compCurDisc=d;cpRenderBoard();
  var q=getQuestion();compCurQ=q;
  document.getElementById('qDisc').textContent=d.label.replace(/\n/g,' ');
  document.getElementById('qPts').textContent='1 point';
  document.getElementById('qPlayer').textContent=compPlayers[0].name;
  document.getElementById('qIdx').textContent='Question '+(kdoQuestionCount+1)+'/'+KDO_TOTAL;
  document.getElementById('qText').textContent=q.data.q;
  var choices=document.getElementById('qChoices');choices.innerHTML='';
  ['A','B','C','D'].forEach(function(letter,i){var el=document.createElement('div');el.className='choice';el.dataset.correct=i===q.data.answer?'1':'0';el.innerHTML='<div class="opt">'+letter+'</div><div>'+escapeHtml(q.data.choices[i])+'</div>';el.addEventListener('click',function(){answerChoice(i,el)});choices.appendChild(el)});
  var answer=document.getElementById('qAnswer');answer.className='answer';answer.textContent='';
  document.getElementById('quizOv').classList.add('show');kdoLocked=false;renderTurn();
}
function answerChoice(i,el){
  if(!kdoInProgress||kdoLocked||!compCurQ)return;kdoLocked=true;
  var q=compCurQ.data,all=Array.prototype.slice.call(document.querySelectorAll('.choice'));all.forEach(function(c){c.classList.add('disabled')});
  var correct=i===q.answer;el.classList.add(correct?'correct':'wrong');
  kdoQuestionCount+=1;var p=compPlayers[0];if(correct)p.score+=1;p.pos=kdoQuestionCount;cpRenderBoard();renderScores();
  var answer=document.getElementById('qAnswer');answer.className='answer show';answer.textContent='Réponse enregistrée.';renderTurn();
  setTimeout(function(){if(kdoQuestionCount>=KDO_TOTAL)finishGame();else{document.getElementById('quizOv').classList.remove('show');compCurDisc=null;compCurQ=null;kdoLocked=false;setTimeout(function(){compPickDisc(1+Math.floor(Math.random()*6))},45)}},180);
}
function finishGame(){
  kdoInProgress=false;kdoLocked=true;document.getElementById('quizOv').classList.remove('show');setBoardEnabled(false);compCurDisc=null;cpRenderBoard();
  var score=compPlayers[0]?compPlayers[0].score:0,result=document.getElementById('kdoResult');
  result.classList.add('show');result.innerHTML='<b>Partie terminée</b><span>Score final : '+score+' points sur '+KDO_TOTAL+'. '+(score>=KDO_TARGET?'Objectif atteint.':'Objectif non atteint.')+'</span>';
  document.getElementById('turnBox').innerHTML='<div class="name">Partie terminée</div><div class="meta">Score '+score+'/'+KDO_TOTAL+' · Objectif '+KDO_TARGET+'/'+KDO_TOTAL+'</div>';renderScores()
}
function startGame(){
  if(kdoInProgress)return;
  var name=(document.getElementById('p1').value||'Joueur').trim()||'Joueur';
  compPlayers=[{name:name,pos:0,score:0,color:COMP_COLORS[0],elim:false}];compArrivalOrder=[];currentPlayer=0;targetScore=KDO_TARGET;compCurDisc=null;compCurQ=null;kdoQuestionCount=0;kdoInProgress=true;kdoLocked=false;resetQuestions();
  document.getElementById('kdoResult').classList.remove('show');document.getElementById('kdoResult').innerHTML='';setBoardEnabled(false);renderTurn();cpRenderBoard();renderScores();
  setTimeout(function(){compPickDisc(1+Math.floor(Math.random()*6))},120)
}
function resetGame(){compPlayers=[];compArrivalOrder=[];compCurDisc=null;compCurQ=null;kdoQuestionCount=0;kdoInProgress=false;kdoLocked=false;resetQuestions();document.getElementById('quizOv').classList.remove('show');document.getElementById('kdoResult').classList.remove('show');document.getElementById('kdoResult').innerHTML='';setBoardEnabled(false);renderTurn();cpRenderBoard();renderScores()}
window.startGame=startGame;window.kdoStartGame=startGame;
document.getElementById('startBtn').addEventListener('click',startGame);document.getElementById('resetBtn').addEventListener('click',resetGame);document.getElementById('nextBtn').addEventListener('click',function(){});document.getElementById('closeBtn').addEventListener('click',function(){});
cpBuildBoard();resetQuestions();setBoardEnabled(false);renderTurn();cpRenderBoard();
</script>
