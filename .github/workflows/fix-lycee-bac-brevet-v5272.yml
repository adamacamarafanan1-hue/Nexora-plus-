name: Corriger Lycée BAC Brevet V527.2

on:
  push:
    paths:
      - '.github/workflows/fix-lycee-bac-brevet-v5272.yml'
      - '.github/scripts/fix_lycee_bac_brevet_v5272.py'
      - '.github/scripts/run_fix_lycee_bac_brevet_v5272.py'

permissions:
  contents: write

concurrency:
  group: nexora-fix-lycee-bac-brevet-v5272
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Intégrer la correction V527.2
        run: python3 .github/scripts/run_fix_lycee_bac_brevet_v5272.py

      - name: Vérifier JavaScript et cohérence
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/nexora-secure-v525.js
          node --check assets/js/nexora-academy-v524.js
          grep -q 'window.NexoraBac={open:openBacRestored' assets/js/nexora-academy-v524.js
          grep -q 'window.NexoraDixieme={open:openTenRestored' assets/js/nexora-academy-v524.js
          grep -q 'NX_SECURE_FETCH_TIMEOUT_MS=45000' assets/js/nexora-secure-v525.js
          grep -q 'response&&response.status===401' assets/js/nexora-secure-v525.js
          grep -q 'nexora-academy-v524.js?v=527.2' index.html
          grep -q 'nexora-academy-v524.css?v=527.2' index.html
          grep -q 'nexora-v527-cours-3' service-worker.js
          grep -q '"version": "V527.2"' version.json
          git diff --check

      - name: Publier dans main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/nexora-secure-v525.js assets/js/nexora-academy-v524.js assets/css/nexora-academy-v524.css index.html service-worker.js version.json
          if git diff --cached --quiet; then
            echo "Aucune modification applicative à publier."
            exit 0
          fi
          git commit -m "Réparer Lycée BAC et Brevet V527.2"
          git push origin HEAD:main
