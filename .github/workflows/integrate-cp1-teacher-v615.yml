name: Integrer maitre simple CP1 V615
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/integrate_cp1_teacher_v615.py'
      - '.github/workflows/integrate-cp1-teacher-v615.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            assets/js/nx-v157-primary-school-script.js
            version.json
            .github/scripts/integrate_cp1_teacher_v615.py
          sparse-checkout-cone-mode: false
      - run: python .github/scripts/integrate_cp1_teacher_v615.py
      - run: node --check assets/js/nx-v157-primary-school-script.js
      - run: |
          git config user.name 'Nexora Curriculum Bot'
          git config user.email 'actions@github.com'
          git add assets/js/nx-v157-primary-school-script.js version.json
          if git diff --cached --quiet; then
            echo 'Aucun changement'
          else
            git commit -m 'Integrate simple teacher-first CP1 pedagogy V615'
            git push
          fi
