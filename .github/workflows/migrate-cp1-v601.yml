name: Integrer CP1 V601

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-cp1-v601.yml'
      - '.github/scripts/migrate_cp1_v601.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrer la nouvelle pedagogie CP1
        run: |
          if [ ! -f .github/scripts/migrate_cp1_v601.py ]; then
            echo "Script de migration pas encore present."
            exit 0
          fi
          python .github/scripts/migrate_cp1_v601.py
      - name: Verifier JavaScript
        run: |
          if [ -f .github/scripts/migrate_cp1_v601.py ]; then
            node --check assets/js/nx-v157-primary-school-script.js
          fi
      - name: Commit source integree
        run: |
          if git diff --quiet -- assets/js/nx-v157-primary-school-script.js version.json; then
            echo "Aucun changement a committer."
            exit 0
          fi
          git config user.name "Nexora Curriculum Bot"
          git config user.email "actions@github.com"
          git add assets/js/nx-v157-primary-school-script.js version.json
          git commit -m "Integrate CP1 lessons twice before corrected exercises V601"
          git push
