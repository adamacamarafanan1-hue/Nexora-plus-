name: Integrer pedagogie adaptative CP1 V609
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/migrate_cp1_adaptive_v609.py'
      - '.github/workflows/migrate-cp1-adaptive-v609.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/migrate_cp1_adaptive_v609.py
      - run: node --check assets/js/nx-v157-primary-school-script.js
      - run: |
          git config user.name 'Nexora Curriculum Bot'
          git config user.email 'actions@github.com'
          git add assets/js/nx-v157-primary-school-script.js version.json
          if git diff --cached --quiet; then echo 'Aucun changement'; else git commit -m 'Integrate adaptive CP1 learning flow V609' && git push; fi
