name: Integrer UX enfant CP1 V610
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/migrate_cp1_child_ux_v610.py'
      - '.github/workflows/migrate-cp1-child-ux-v610.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/migrate_cp1_child_ux_v610.py
      - run: node --check assets/js/nx-v157-primary-school-script.js
      - run: |
          git config user.name 'Nexora Curriculum Bot'
          git config user.email 'actions@github.com'
          git add assets/js/nx-v157-primary-school-script.js version.json
          if git diff --cached --quiet; then echo 'Aucun changement'; else git commit -m 'Integrate child-first CP1 UX V610' && git push; fi
