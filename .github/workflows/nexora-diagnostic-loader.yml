name: Nexora diagnostic chargeur Académie

on:
  push:
    paths:
      - '.github/workflows/nexora-diagnostic-loader.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tracer l’empaquetage Bac et Brevet V504
        shell: bash
        run: |
          set -euo pipefail
          git show c7000f29a7fe03622f23634b8d738f18689cb5d7:public/index.html > /tmp/nexora-v504.html
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/nexora-v504.html').read_text(encoding='utf-8', errors='replace')
          for needle in ['modules/bac/index.html','modules/dixieme/index.html','__NEXORA_ACADEMY_EMBEDDED_GZIP_B64__','NexoraBac','NexoraDixieme']:
              print('\n===== '+needle+' =====')
              pos=0; count=0
              while True:
                  i=text.find(needle,pos)
                  if i<0 or count>=12: break
                  a=max(0,i-2600); b=min(len(text),i+5200)
                  print(text[a:b].replace('\n','\\n'))
                  print('\n--- occurrence '+str(count+1)+' ---')
                  pos=i+len(needle); count+=1
              print('occurrences:',count)
          PY
