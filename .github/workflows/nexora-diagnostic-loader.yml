name: Nexora diagnostic chargeur Académie

on:
  push:
    paths:
      - '.github/workflows/nexora-diagnostic-loader.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lire les contrôleurs Bac et Brevet historiques
        shell: bash
        run: |
          set -euo pipefail
          git show c7000f29a7fe03622f23634b8d738f18689cb5d7:public/index.html > /tmp/nexora-v504.html
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          text = Path('/tmp/nexora-v504.html').read_text(encoding='utf-8', errors='replace')
          for path in ['modules/bac/index.html','modules/dixieme/index.html']:
              print('\n===== '+path+' =====')
              patterns = [
                  r'["\']'+re.escape(path)+r'["\']\s*:\s*["\']([A-Za-z0-9+/=_-]+)["\']',
                  r'["\']'+re.escape(path)+r'["\']\s*=\s*["\']([A-Za-z0-9+/=_-]+)["\']'
              ]
              value = None
              for pattern in patterns:
                  m = re.search(pattern, text)
                  if m:
                      value = m.group(1)
                      break
              if not value:
                  print('PAYLOAD_NOT_FOUND')
                  continue
              raw = base64.b64decode(value + '='*((4-len(value)%4)%4))
              try:
                  data = gzip.decompress(raw).decode('utf-8','replace')
              except Exception:
                  data = raw.decode('utf-8','replace')
              print('decoded_bytes=',len(data.encode('utf-8')))
              for needle in ['NexoraBac','NexoraDixieme','postMessage','function open','open:function','window.parent','DOMContentLoaded']:
                  print('\n--- '+needle+' ---')
                  pos = 0; count = 0
                  while True:
                      i = data.find(needle,pos)
                      if i < 0 or count >= 6: break
                      a=max(0,i-1200); b=min(len(data),i+2600)
                      print(data[a:b].replace('\n','\\n'))
                      pos=i+len(needle); count+=1
                  print('occurrences:',count)
          PY
