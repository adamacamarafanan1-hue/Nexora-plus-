name: Déployer Nexora V525

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Installer la V525
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier et installer la V525 à la racine
        shell: bash
        run: |
          set -euo pipefail

          archive="NEXORA_V525_CORRECTION_ACCES_COURS_PRET_VERCEL.zip"
          extract_dir="$RUNNER_TEMP/nexora-v525"

          if [[ ! -f "$archive" ]]; then
            echo "Le ZIP V525 est introuvable à la racine du dépôt."
            exit 1
          fi

          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"

          test -f "$extract_dir/index.html"
          test -f "$extract_dir/vercel.json"
          test -f "$extract_dir/version.json"
          test -f "$extract_dir/assets/js/nexora-secure-v525.js"
          grep -q '"version"[[:space:]]*:[[:space:]]*"V525"' "$extract_dir/version.json"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$archive" \
            -exec rm -rf -- {} +

          cp -a "$extract_dir"/. .
          rm -f "$archive"

      - name: Enregistrer la V525 dans la branche principale
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "La V525 est déjà installée."
          else
            git commit -m "Corriger l'ouverture des cours Nexora V525"
            git push
          fi
